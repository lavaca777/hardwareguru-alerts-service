name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Alerts.sln

      - name: Verify formatting
        run: dotnet format Alerts.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Alerts.sln --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test Alerts.sln
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hardwareguru-alerts-service:ci .

      - name: Start container
        run: >
          docker run -d
          --name alerts-api-ci
          -p 5001:8080
          -e Kafka__Enabled=false
          -e Database__ApplyMigrations=false
          hardwareguru-alerts-service:ci

      - name: Check health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs alerts-api-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f alerts-api-ci || true
